kind: Secret
metadata:
  name: dentaris-tls-secret
  namespace: dentaris
  labels:
    app: dentaris
    component: tls-secret
type: kubernetes.io/tls
data:
  # TLS Certificate (base64 encoded)
  tls.crt: "LS0tLS1CRUdJTiBDRVJUSUZJQ0FURS0tLS0t..."
  tls.key: "LS0tLS1CRUdJTiBQUklWQVRFIEtFWS0tLS0t..."





