apiVersion: v1
kind: Namespace
metadata:
  name: dentaris
  labels:
    name: dentaris
    app: dentaris
    environment: production
  annotations:
    description: "Dentaris Dental Clinic Management System"
    contact: "admin@dentaris.com"
    version: "1.0.0"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: dentaris-quota
  namespace: dentaris
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 4Gi
    limits.cpu: "4"
    limits.memory: 8Gi
    persistentvolumeclaims: "10"
    pods: "20"
    services: "10"
    secrets: "20"
    configmaps: "20"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: dentaris-limits
  namespace: dentaris
spec:
  limits:
  - default:
      cpu: "500m"
      memory: "512Mi"
    defaultRequest:
      cpu: "100m"
      memory: "128Mi"
    type: Container
  - max:
      cpu: "2"
      memory: "4Gi"
    min:
      cpu: "50m"
      memory: "64Mi"
    type: Container





