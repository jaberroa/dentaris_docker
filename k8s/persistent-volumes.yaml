---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dentaris-storage-pvc
  namespace: dentaris
  labels:
    app: dentaris
    component: storage
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: dentaris-storage
---
