apiVersion: v1
kind: PersistentVolume
metadata:
  name: dentaris-storage-pv
  namespace: dentaris
  labels:
    app: dentaris
    component: storage
spec:
  capacity:
    storage: 10Gi
  accessModes:
  - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: dentaris-storage
  hostPath:
    path: /var/lib/dentaris/storage
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: dentaris-mysql-pv
  namespace: dentaris
  labels:
    app: dentaris
    component: mysql
spec:
  capacity:
    storage: 20Gi
  accessModes:
  - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: dentaris-mysql
  hostPath:
    path: /var/lib/dentaris/mysql
---
