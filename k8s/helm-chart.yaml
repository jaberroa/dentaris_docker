apiVersion: v1
kind: ConfigMap
metadata:
  name: dentaris-helm-values
  namespace: dentaris
  labels:
    app: dentaris
    component: helm-values
data:
  values.yaml: |
    # Dentaris Helm Chart Values
    app:
      name: dentaris
      version: "1.0.0"
      environment: production
      
    image:
      repository: dentaris
      tag: latest
      pullPolicy: Always
      
    replicaCount: 3
      
    service:
      type: ClusterIP
      port: 80
      targetPort: 80
      
    ingress:
      enabled: true
      className: nginx
      annotations:
        nginx.ingress.kubernetes.io/rewrite-target: /
        nginx.ingress.kubernetes.io/ssl-redirect: "true"
        nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
      hosts:
        - host: dentaris.com
          paths:
            - path: /
              pathType: Prefix
      tls:
        - secretName: tls-secret
          hosts:
            - dentaris.com
            
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi
        
    autoscaling:
      enabled: true
      minReplicas: 3
      maxReplicas: 10
      targetCPUUtilizationPercentage: 70
      targetMemoryUtilizationPercentage: 80
      
    mysql:
      enabled: true
      image:
        repository: mysql
        tag: "8.0"
      persistence:
        enabled: true
        size: 20Gi
      resources:
        requests:
          cpu: 200m
          memory: 512Mi
        limits:
          cpu: 1000m
          memory: 2Gi
          
    redis:
      enabled: true
      image:
        repository: redis
        tag: "7-alpine"
      persistence:
        enabled: true
        size: 5Gi
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi
          
    monitoring:
      enabled: true
      prometheus:
        enabled: true
        persistence:
          enabled: true
          size: 10Gi
      grafana:
        enabled: true
        persistence:
          enabled: true
          size: 5Gi
        adminPassword: "admin_password"
        
    security:
      enabled: true
      networkPolicies:
        enabled: true
      podSecurityPolicy:
        enabled: true
      rbac:
        enabled: true
        
    backup:
      enabled: true
      schedule: "0 2 * * *"
      retention: "7d"
      storage:
        size: 50Gi





