apiVersion: v1
kind: ConfigMap
metadata:
  name: dentaris-config
  namespace: dentaris
  labels:
    app: dentaris
    component: config
data:
  # Application Configuration
  APP_NAME: "Dentaris"
  APP_ENV: "production"
  APP_DEBUG: "false"
  APP_URL: "https://dentaris.com"
  APP_TIMEZONE: "America/Mexico_City"
  
  # Database Configuration
  DB_CONNECTION: "mysql"
  DB_HOST: "mysql-service"
  DB_PORT: "3306"
  DB_DATABASE: "dentaris"
  
  # Redis Configuration
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  
  # Cache Configuration
  CACHE_DRIVER: "redis"
  SESSION_DRIVER: "redis"
  QUEUE_CONNECTION: "redis"
  
  # Security Configuration
  SECURITY_TESTING_ENABLED: "true"
  AUDIT_LOGGING_ENABLED: "true"
  XSS_PROTECTION_ENABLED: "true"
  CSRF_PROTECTION_ENABLED: "true"
  
  # Monitoring Configuration
  PROMETHEUS_ENABLED: "true"
  GRAFANA_ENABLED: "true"
  HEALTH_CHECK_ENABLED: "true"
  
  # Logging Configuration
  LOG_CHANNEL: "stack"
  LOG_LEVEL: "info"
  LOG_DEPRECATIONS_CHANNEL: "null"
  
  # Mail Configuration
  MAIL_MAILER: "smtp"
  MAIL_HOST: "smtp.gmail.com"
  MAIL_PORT: "587"
  MAIL_USERNAME: "noreply@dentaris.com"
  MAIL_ENCRYPTION: "tls"
  
  # File Storage
  FILESYSTEM_DISK: "local"
  AWS_ACCESS_KEY_ID: ""
  AWS_SECRET_ACCESS_KEY: ""
  AWS_DEFAULT_REGION: "us-east-1"
  AWS_BUCKET: ""
  
  # Broadcasting
  BROADCAST_DRIVER: "log"
  PUSHER_APP_ID: ""
  PUSHER_APP_KEY: ""
  PUSHER_APP_SECRET: ""
  PUSHER_APP_CLUSTER: "mt1"
  
  # Vite Configuration
  VITE_APP_NAME: "Dentaris"
  VITE_PUSHER_APP_KEY: ""
  VITE_PUSHER_HOST: ""
  VITE_PUSHER_PORT: "443"
  VITE_PUSHER_SCHEME: "https"
  VITE_PUSHER_APP_CLUSTER: "mt1"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: dentaris
  labels:
    app: dentaris
    component: nginx
data:
  nginx.conf: |
    user nginx;
    worker_processes auto;
    error_log /var/log/nginx/error.log warn;
    pid /var/run/nginx.pid;

    events {
        worker_connections 1024;
        use epoll;
        multi_accept on;
    }

    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;

        # Logging
        log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for"';

        access_log /var/log/nginx/access.log main;

        # Basic settings
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        keepalive_timeout 65;
        types_hash_max_size 2048;
        server_tokens off;

        # Gzip compression
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_proxied any;
        gzip_comp_level 6;
        gzip_types
            text/plain
            text/css
            text/xml
            text/javascript
            application/json
            application/javascript
            application/xml+rss
            application/atom+xml
            image/svg+xml;

        # Security headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

        # Rate limiting
        limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
        limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

        # Upstream PHP-FPM
        upstream php-fpm {
            server 127.0.0.1:9000;
        }

        server {
            listen 80;
            server_name localhost;
            root /var/www/html/public;
            index index.php index.html;

            # Security
            server_tokens off;
            
            # File upload size
            client_max_body_size 100M;

            # Main location
            location / {
                try_files $uri $uri/ /index.php?$query_string;
            }

            # PHP-FPM
            location ~ \.php$ {
                fastcgi_pass php-fpm;
                fastcgi_index index.php;
                fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
                include fastcgi_params;
                
                # Security
                fastcgi_hide_header X-Powered-By;
                fastcgi_read_timeout 300;
                fastcgi_send_timeout 300;
            }

            # API rate limiting
            location /api/ {
                limit_req zone=api burst=20 nodelay;
                try_files $uri $uri/ /index.php?$query_string;
            }

            # Login rate limiting
            location /login {
                limit_req zone=login burst=5 nodelay;
                try_files $uri $uri/ /index.php?$query_string;
            }

            # Health check
            location /health {
                access_log off;
                return 200 "healthy\n";
                add_header Content-Type text/plain;
            }

            # Static files
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
                add_header X-Content-Type-Options "nosniff";
            }

            # Deny access to sensitive files
            location ~ /\. {
                deny all;
            }

            location ~ /(storage|bootstrap/cache) {
                deny all;
            }

            # Security.txt
            location /.well-known/security.txt {
                return 301 /security.txt;
            }

            location /security.txt {
                add_header Content-Type text/plain;
            }
        }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-config
  namespace: dentaris
  labels:
    app: dentaris
    component: mysql
data:
  my.cnf: |
    [mysqld]
    # Basic settings
    port = 3306
    socket = /var/run/mysqld/mysqld.sock
    pid-file = /var/run/mysqld/mysqld.pid
    datadir = /var/lib/mysql
    tmpdir = /tmp
    
    # Character set
    character-set-server = utf8mb4
    collation-server = utf8mb4_unicode_ci
    init_connect = 'SET NAMES utf8mb4'
    
    # InnoDB settings
    innodb_buffer_pool_size = 1G
    innodb_log_file_size = 256M
    innodb_log_buffer_size = 16M
    innodb_flush_log_at_trx_commit = 2
    innodb_flush_method = O_DIRECT
    
    # Query cache
    query_cache_type = 1
    query_cache_size = 64M
    query_cache_limit = 2M
    
    # Connection settings
    max_connections = 200
    max_connect_errors = 1000
    connect_timeout = 10
    wait_timeout = 600
    interactive_timeout = 600
    
    # Security
    local-infile = 0
    skip-name-resolve = 1
    
    # Logging
    log-error = /var/log/mysql/error.log
    slow_query_log = 1
    slow_query_log_file = /var/log/mysql/slow.log
    long_query_time = 2
    
    # Binary logging
    log-bin = mysql-bin
    binlog_format = ROW
    expire_logs_days = 7
    
    # Performance
    key_buffer_size = 32M
    max_allowed_packet = 64M
    table_open_cache = 400
    sort_buffer_size = 2M
    read_buffer_size = 2M
    read_rnd_buffer_size = 8M
    myisam_sort_buffer_size = 64M
    thread_cache_size = 8
    thread_concurrency = 8
    
    [mysql]
    default-character-set = utf8mb4
    
    [client]
    default-character-set = utf8mb4





