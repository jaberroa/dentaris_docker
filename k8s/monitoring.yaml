apiVersion: apps/v1
kind: Deployment
metadata:
  name: dentaris-prometheus
  namespace: dentaris
  labels:
    app: dentaris
    component: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dentaris
      component: prometheus
  template:
    metadata:
      labels:
        app: dentaris
        component: prometheus
    spec:
      containers:
      - name: prometheus
        image: prom/prometheus:latest
        ports:
        - containerPort: 9090
        volumeMounts:
        - name: prometheus-config
          mountPath: /etc/prometheus
        - name: prometheus-data
          mountPath: /prometheus
      volumes:
      - name: prometheus-config
        configMap:
          name: prometheus-config
      - name: prometheus-data
        persistentVolumeClaim:
          claimName: prometheus-pvc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dentaris-grafana
  namespace: dentaris
  labels:
    app: dentaris
    component: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dentaris
      component: grafana
  template:
    metadata:
      labels:
        app: dentaris
        component: grafana
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:latest
        ports:
        - containerPort: 3000
        env:
        - name: GF_SECURITY_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: dentaris-secrets
              key: GRAFANA_PASSWORD
        volumeMounts:
        - name: grafana-data
          mountPath: /var/lib/grafana
      volumes:
      - name: grafana-data
        persistentVolumeClaim:
          claimName: grafana-pvc





