version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: dentaris_app_dev
    restart: unless-stopped
    ports:
      - "8000:80"
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=dentaris_dev
      - DB_USERNAME=dentaris
      - DB_PASSWORD=dentaris_password
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - .:/var/www/html
      - ./storage:/var/www/html/storage
      - ./bootstrap/cache:/var/www/html/bootstrap/cache
    depends_on:
      - mysql
      - redis
    networks:
      - dentaris_dev_network

  mysql:
    image: mysql:8.0
    container_name: dentaris_mysql_dev
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=root_password
      - MYSQL_DATABASE=dentaris_dev
      - MYSQL_USER=dentaris
      - MYSQL_PASSWORD=dentaris_password
    volumes:
      - mysql_dev_data:/var/lib/mysql
    ports:
      - "3307:3306"
    networks:
      - dentaris_dev_network

  redis:
    image: redis:7-alpine
    container_name: dentaris_redis_dev
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_dev_data:/data
    ports:
      - "6380:6379"
    networks:
      - dentaris_dev_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: dentaris_phpmyadmin
    restart: unless-stopped
    environment:
      - PMA_HOST=mysql
      - PMA_USER=dentaris
      - PMA_PASSWORD=dentaris_password
    ports:
      - "8080:80"
    depends_on:
      - mysql
    networks:
      - dentaris_dev_network

  mailhog:
    image: mailhog/mailhog:latest
    container_name: dentaris_mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - dentaris_dev_network

volumes:
  mysql_dev_data:
  redis_dev_data:

networks:
  dentaris_dev_network:
    driver: bridge





