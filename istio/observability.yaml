apiVersion: telemetry.istio.io/v1alpha1
kind: Telemetry
metadata:
  name: dentaris-telemetry
  namespace: dentaris
  labels:
    app: dentaris
    component: telemetry
spec:
  selector:
    matchLabels:
      app: dentaris
  metrics:
  - providers:
    - name: prometheus
  - overrides:
    - match:
        metric: ALL_METRICS
      tagOverrides:
        request_protocol:
          value: "http"
        response_code:
          value: "200"
        source_service:
          value: "dentaris"
        destination_service:
          value: "dentaris-app-service"
  tracing:
  - providers:
    - name: jaeger
  - overrides:
    - match:
        metric: ALL_METRICS
      tagOverrides:
        trace_id:
          value: "generated"
        span_id:
          value: "generated"
        parent_span_id:
          value: "inherited"
        span_name:
          value: "dentaris-request"
        span_kind:
          value: "server"
        span_status:
          value: "ok"
---
