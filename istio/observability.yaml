apiVersion: telemetry.istio.io/v1alpha1
kind: Telemetry
metadata:
  name: dentaris-access-logging
  namespace: dentaris
  labels:
    app: dentaris
    component: access-logging
spec:
  selector:
    matchLabels:
      app: dentaris
  accessLogging:
  - providers:
    - name: otel
  - overrides:
    - match:
        metric: ALL_METRICS
      tagOverrides:
        log_level:
          value: "info"
        log_format:
          value: "json"
        log_fields:
          value: "timestamp,method,path,status,response_time,user_agent,ip"
---
